<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles/global.css">

    <link rel="stylesheet" href="styles/ui.css">
    <link rel="stylesheet" href="styles/dialogue.css">

    <script src="scripts/game-controller.js" type="module"></script>
</head>
<body>
    <main class="main">
        <div id="game-container" class="ui-section grid-2">

        </div>
        <div class="ui-section grid-1" id="dialogue-box-container">
            <span id="dialogue-hint">Press space to progress dialogue.</span>
            <ul id="dialogue-list" class="ui-card">

            </ul>
        </div>
        <div id="ui-container" class="ui-section grid-3">
            <div id="dialogue-choices-container" class="grid-1 ui-card">
                <span>Dialogue choices</span>
                <ul id="dialogue-choices-list">

                </ul>
            </div>
            <div id="ui-buttons-container" class="grid-2 ui-card">
                <button class="ui-button" id="restart-button"><i class="fa-solid fa-repeat"></i></button>
            </div>
        </div>
    </main>
</body>
</html>
